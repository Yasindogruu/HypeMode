<script>window.HM_PWA=true;(function(){var r;var p=new Promise(function(x){r=x});window.__hmResolve=r;
window.claude={use:function(n){if(n!=='db'&&n!=='user')return Promise.resolve(null);return p.then(function(a){return a?a[n]||null:null})}}})();</script>
<script type="module" src="fb.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
.gen-mus button.on{background:rgba(var(--a1rgb),.14)}.mtag{background:rgba(255,255,255,.08)}
button{touch-action:manipulation}button:active{opacity:.6;transform:scale(.98)}
.gx .pex-b,.gx-b{cursor:pointer}.gx-i{font-size:12px;color:var(--mut);font-weight:500}
.gi-top{display:flex;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;margin-bottom:10px}
.gi-chips{display:flex;flex-wrap:wrap;gap:6px}

:root{
  --bg:#0b0b0d;--bg2:#151517;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.09);--txt:#f3f3f5;--mut:#9b9ba4;--a1:#ff3b30;--a2:#ff6a3d;--a3:#3fd0ff;
  --ok:#3ee6a0;--warn:#ffb547;--bad:#ff5f7a;
  --hero:radial-gradient(130% 365px at 50% -38px,var(--h1) 0%,var(--h2) 26%,var(--h3) 42%,var(--h4) 62%,transparent 80%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:var(--txt);font-family:Inter,system-ui,sans-serif}
body{min-height:100dvh;display:flex;justify-content:center}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--a1)}
select option{background:#1c1c1e}
#app{isolation:isolate;width:100%;max-width:440px;min-height:100dvh;background:var(--bg);position:relative;overflow-x:hidden;
  padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
@media(min-width:520px){body{padding:24px 0}#app{min-height:calc(100dvh - 48px);border-radius:36px;box-shadow:0 0 0 1px #232326,0 30px 80px rgba(0,0,0,.6)}}
.hero{position:relative;padding:18px 20px 8px}
.hero:before,.st-hero:before{content:'';position:absolute;left:0;right:0;top:0;height:470px;background:var(--hero);z-index:-1;pointer-events:none}
.top{display:flex;align-items:center;justify-content:space-between;height:40px}
.brand{font-family:Unbounded;font-weight:800;letter-spacing:.06em;font-size:17px}
.icon-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;backdrop-filter:blur(8px)}
.icon-btn svg{width:18px;height:18px}
.date{text-align:center;margin-top:14px;font-size:11px;letter-spacing:.18em;color:rgba(255,255,255,.7);text-transform:uppercase}
.date b{display:block;font-size:15px;letter-spacing:0;color:#fff;text-transform:none;margin-top:2px}
.bignum{font-family:Unbounded;font-weight:800;font-size:110px;line-height:1;text-align:center;margin-top:16px;
  background:linear-gradient(180deg,#fff 20%,rgba(255,255,255,.35));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--mut);font-size:13px}
.title{font-family:Unbounded;font-weight:700;font-size:28px;text-align:center;margin:8px 0 18px}
.pad{padding:0 20px}
.btn{display:block;width:100%;padding:16px;border-radius:999px;font-weight:600;font-size:15px;text-align:center;
  background:linear-gradient(90deg,#ffe8e5,#ffffff);color:#2b0f0c;box-shadow:0 10px 30px rgba(255,60,48,.35)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card2);color:var(--txt);box-shadow:none}
.btn.sm{display:inline-block;width:auto;padding:9px 16px;font-size:13px}
.link{display:block;margin:12px auto 0;color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 20px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.kpi{font-family:Unbounded;font-weight:700;font-size:30px}
.kpi small{font-family:Inter;font-size:12px;color:var(--mut);font-weight:500;margin-left:4px}
.lbl{font-size:12px;color:var(--mut)}
.pill{padding:8px 14px;border-radius:999px;background:var(--card2);font-size:13px;font-weight:600}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--a3),var(--a1))}
.coach{border:1px solid rgba(255,80,60,.35);background:linear-gradient(135deg,rgba(var(--a1rgb),.16),rgba(var(--a1rgb),.1))}
.coach h4{margin:0 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--a4)}
.coach p{margin:6px 0 0;font-size:14px;line-height:1.45}
nav.tabs{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:20;
  display:flex;gap:4px;padding:6px;border-radius:999px;background:rgba(30,30,32,.88);backdrop-filter:blur(16px);border:1px solid var(--line)}
nav.tabs button{width:72px;height:50px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mut)}nav.tabs button small{font-size:10px;font-weight:600}nav.tabs button span{display:grid;place-items:center}
nav.tabs button.on{background:rgba(255,255,255,.12);color:#fff}
nav.tabs svg{width:20px;height:20px}
.h2{font-family:Unbounded;font-weight:700;font-size:24px;margin:6px 0 4px}
.ex-list .it{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.ex-list .it span{color:var(--mut);font-size:13px}
.back{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
.bottom-cta{position:sticky;bottom:calc(16px + env(safe-area-inset-bottom));padding:16px 20px 0;z-index:5}
/* countdown */
.cd{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(120% 80% at 50% 0%,#ff4a3d,#e0201b 40%,#0b0b0d 85%)}
.cd .t{font-family:Unbounded;font-weight:700;font-size:26px;text-align:center}
.cd .k{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.7;margin-bottom:6px}
.cd .ring{position:relative;width:210px;height:210px;margin:40px 0 24px}
.cd .ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.cd .n{position:absolute;inset:0;display:grid;place-items:center;font-family:Unbounded;font-weight:800;font-size:96px;animation:pop .9s ease}
@keyframes pop{0%{transform:scale(.6);opacity:0}30%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}
/* workout */
.wk-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0}
.wk-title{font-family:Unbounded;font-weight:700;font-size:26px;padding:14px 20px 4px}
.chips{display:flex;gap:8px;padding:6px 20px 0;flex-wrap:wrap}
.chip{font-size:12px;padding:7px 11px;border-radius:999px;background:var(--card2);color:#d6d9f5}
.sugg{margin:12px 20px 4px;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,rgba(63,208,255,.14),rgba(var(--a1rgb),.12));border:1px solid rgba(63,208,255,.3);font-size:13px;line-height:1.4}
.sugg b{color:var(--a3)}
.set{display:grid;grid-template-columns:34px 1fr 1fr 64px 40px;gap:8px;align-items:center;padding:8px 20px}
.set .no{font-family:Unbounded;font-weight:700;color:var(--mut);font-size:15px}
.set input{text-align:center;padding:12px 6px;border-radius:14px}
.set.done input{border-color:rgba(62,230,160,.4);background:rgba(62,230,160,.08)}
.chk{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.set.done .chk{background:var(--ok);border-color:var(--ok);color:#06281a}
.set-h{display:grid;grid-template-columns:34px 1fr 1fr 64px 40px;gap:8px;padding:10px 20px 0;font-size:11px;color:var(--mut);text-align:center;text-transform:uppercase;letter-spacing:.08em}
.rest{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:10px;align-items:center;
  padding:8px 10px 8px 16px;border-radius:999px;background:rgba(30,30,32,.94);border:1px solid rgba(63,208,255,.4);backdrop-filter:blur(12px);font-weight:600}
.rest button{padding:6px 10px;border-radius:999px;background:var(--card2);font-size:12px}
.dots{display:flex;gap:5px;justify-content:center;padding:14px 0 0}
.dots i{width:7px;height:7px;border-radius:9px;background:rgba(255,255,255,.18)}
.dots i.on{width:22px;background:#fff}.dots i.ok{background:var(--ok)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:440px;max-height:88dvh;overflow:auto;background:#161618;border-radius:26px 26px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-family:Unbounded;font-size:18px;margin:4px 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fld{margin-bottom:10px}.fld label{display:block;font-size:12px;color:var(--mut);margin:0 0 5px 2px}
.meal{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border:0}
.meal small{color:var(--mut);display:block;margin-top:2px}
.x{color:var(--mut);padding:6px 8px}
canvas{width:100%;height:170px;display:block}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.seg button{white-space:nowrap;padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--mut)}
.seg button.on{background:#fff;color:#2b0f0c;border-color:#fff}
.mbar{display:grid;grid-template-columns:86px 1fr 34px;gap:10px;align-items:center;font-size:13px;margin:9px 0}
.mbar .bar{margin:0;position:relative;overflow:visible}
.mbar .ref{position:absolute;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,.5)}
.ex-edit{display:grid;grid-template-columns:1fr 34px;gap:8px;padding:10px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
.ex-edit .grid4 input,.ex-edit select{padding:8px;font-size:13px}
.ex-edit .mini{font-size:10px;color:var(--mut);margin:0 0 3px 2px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#fff;color:#2b0f0c;padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;z-index:80;animation:up .2s;white-space:nowrap}
.rest{white-space:nowrap}
.muted{color:var(--mut)}.ok{color:var(--ok)}.warn{color:var(--warn)}
.tag{font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(62,230,160,.15);color:var(--ok);font-weight:600}
.empty{padding:30px 10px;text-align:center;color:var(--mut);font-size:14px}
/* meal plan */
.mp-btn{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;padding:15px;border-radius:999px;background:#fff;color:#2b0f0c;font-weight:600;font-size:15px;box-shadow:0 10px 30px rgba(255,60,48,.35)}
.mp-btn.busy{background:rgba(255,255,255,.16);color:#d5d8f5;box-shadow:none;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.wk{display:flex;align-items:center;justify-content:space-between;margin:16px 0 12px;font-weight:600}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{border-radius:999px;padding:9px 0 6px;background:rgba(255,255,255,.08);border:1.5px solid transparent;text-align:center}
.days button small{display:block;font-size:10px;color:rgba(255,255,255,.6);text-transform:uppercase}
.days button b{font-size:15px;display:block;margin-top:2px}
.days button.today{border-color:#fff}
.days button i{display:block;width:5px;height:5px;border-radius:9px;margin:4px auto 0}
.days button.has i{background:var(--a3)}
.dayc{background:var(--card);border:1px solid var(--line);border-radius:22px;margin:12px 20px;padding:14px 0 12px;scroll-margin-top:16px}
.dayc .dh{display:flex;justify-content:space-between;align-items:center;padding:0 14px}
.dayc .dh b{font-family:Unbounded;font-size:19px}
.dt{font-size:12px;color:var(--mut);margin-top:3px}
.tday{font-size:10px;font-weight:700;color:#ffb38a;background:rgba(255,140,90,.16);padding:3px 7px;border-radius:99px;margin-left:6px;letter-spacing:.06em;vertical-align:3px}
.slots{display:flex;gap:10px;overflow-x:auto;padding:12px 14px 2px;scroll-snap-type:x mandatory;scrollbar-width:none}
.slots::-webkit-scrollbar{display:none}
.slot{flex:0 0 106px;scroll-snap-align:start;text-align:left}
.slot .pl{width:106px;height:94px;border-radius:18px;border:1.5px dashed rgba(255,255,255,.2);display:grid;place-items:center;color:var(--mut);font-size:24px;font-weight:300}
.slot.f .pl{border-color:transparent}
.plate{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;font-size:38px;box-shadow:inset 0 0 0 7px rgba(255,255,255,.25),0 10px 24px rgba(0,0,0,.4)}
.plate.sm{width:48px;height:48px;font-size:22px;flex:0 0 48px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.25)}
.plate.lg{width:120px;height:120px;font-size:58px;margin:4px auto 12px}
.slot .sl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-top:8px}
.slot .nm{font-size:12.5px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .nm.e{color:var(--mut);font-weight:500}
.pop .plate{animation:plate .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes plate{from{transform:scale(.2) rotate(-60deg);opacity:0}}
.rlist{display:flex;gap:12px;align-items:center;width:100%;padding:10px 0;border-bottom:1px solid var(--line);text-align:left}
.rlist small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.stepper{display:flex;align-items:center;gap:12px;justify-content:center;margin:6px 0 12px}
.stepper button{width:36px;height:36px;border-radius:50%;background:var(--card2);font-size:18px}
.macro4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-bottom:12px}
.macro4 div{background:var(--card);border-radius:14px;padding:10px 4px}
.macro4 b{display:block;font-size:17px}
.ing{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.gi{display:flex;gap:12px;align-items:center;width:100%;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.gi .bx{width:22px;height:22px;border-radius:7px;border:1.5px solid rgba(255,255,255,.3);display:grid;place-items:center;flex:0 0 22px}
.gi.on .bx{background:var(--ok);border-color:var(--ok);color:#06281a}
.gi.on span{text-decoration:line-through;color:var(--mut)}
.ingrow{padding:10px 0;border-bottom:1px solid var(--line)}
.stp{width:36px;height:40px;border-radius:12px;background:var(--card2);font-size:18px;flex:0 0 36px}
.qin{width:72px!important;text-align:center;padding:9px 4px!important}
.uin{width:auto!important;padding:9px 6px!important}
.lk{flex:1;text-align:right;font-size:12px;color:var(--mut);white-space:nowrap}
.mph{width:46px;height:46px;border-radius:12px;object-fit:cover;margin-right:12px;flex:0 0 46px;cursor:zoom-in}
.photo-in{display:grid;place-items:center;height:120px;border-radius:18px;border:1.5px dashed rgba(255,255,255,.22);margin-bottom:12px;cursor:pointer;background-size:cover;background-position:center;color:var(--mut);font-weight:600}
.photo-in.has{border:0;color:#fff}.photo-in.has span{background:rgba(0,0,0,.55);padding:6px 12px;border-radius:99px;font-size:13px}
.glasses{display:flex;flex-wrap:wrap;gap:2px;margin:10px 0 4px;font-size:15px}.glasses span{opacity:.18}.glasses span.on{opacity:1}
.wbtn{background:var(--card2);border-radius:14px;padding:9px 4px;text-align:center}.wbtn b{display:block;font-size:15px}.wbtn span{font-size:11px;color:var(--mut)}
.sp{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.sp .bx{width:26px;height:26px;border-radius:8px;border:1.5px solid rgba(255,255,255,.3);display:grid;place-items:center;flex:0 0 26px;margin-top:1px}
.sp.on .bx{background:var(--ok);border-color:var(--ok);color:#06281a;font-weight:700}
.hgrid{display:grid;gap:6px 2px;align-items:center;font-size:13px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pcell{aspect-ratio:1;border-radius:14px;background-size:cover;background-position:center;position:relative;overflow:hidden}
.pcell .pt{position:absolute;left:6px;top:6px;font-size:10px;font-weight:700;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:99px}
.pcell .pk{position:absolute;left:6px;bottom:6px;font-size:10px;font-weight:700;background:rgba(62,230,160,.9);color:#06281a;padding:2px 6px;border-radius:99px}
.pcell .pk.add{background:rgba(255,255,255,.85);color:#2b0f0c}
label.btn{display:flex;align-items:center;justify-content:center}
.ckseg button{padding:6px 10px;font-size:12px}
.ai-load{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:36px 10px}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#ff6a3d;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.score{width:74px;height:74px;border-radius:50%;flex:0 0 74px;display:grid;place-items:center;align-content:center;
  background:radial-gradient(closest-side,#161618 78%,transparent 80% 100%),conic-gradient(#3ee6a0 calc(var(--v)*1%),rgba(255,255,255,.1) 0)}
.score b{font-family:Unbounded;font-size:22px;line-height:1}.score span{font-size:10px;color:var(--mut)}
.rl{margin:4px 0 6px;padding-left:18px;line-height:1.5;font-size:14px}.rl li{margin:4px 0}.ok-l li::marker{color:var(--ok)}
.pl-i{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45}.pl-i>span{font-size:18px}
.cb{font-size:16px}
.tag.ph-cut{background:rgba(255,140,90,.16);color:#ffb38a}.tag.ph-bulk{background:rgba(63,208,255,.15);color:var(--a3)}
.gwrap{position:relative;width:230px;height:230px;margin:6px auto 0}.gauge{width:100%;height:100%}
.gnum{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:10px}
.gnum b{font-family:Unbounded;font-weight:800;font-size:72px;line-height:1}.gnum span{font-size:12px;font-weight:700;letter-spacing:.16em;color:#ffb38a;margin-top:6px}
.gnum small{font-size:9px;letter-spacing:.18em;color:var(--mut);margin-top:3px}
.subs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:-6px}.subs div{text-align:left}
.subs span{display:block;font-size:10px;color:var(--mut)}.subs b{font-size:19px;display:block;margin:2px 0}.subs i{display:block;height:3px;border-radius:3px}
.insight{font-size:16px;line-height:1.5;margin:16px 0 0}.insight b{color:#3fd0ff;font-weight:600}

const latestW=()=>{const b=S.body.filter(x=>x.weight!=null).sort((a,c)=>a.date<c.date?-1:1);return b.length?b[b.length-1].weight:null};
/* vücut geliştirme standartları: definasyon %0,5–1 VA/hafta (Helms 2014), bulk %0,25–0,5 VA/hafta (Iraki 2019) */
const PCT_OPTS={cut:[[0.5,'Yavaş · haftada %0,5'],[0.75,'Standart · haftada %0,75 (önerilen)'],[1,'Hızlı · haftada %1']],bulk:[[0.25,'Temiz · haftada %0,25 (önerilen)'],[0.5,'Standart · haftada %0,5']]};
const rateKg=(pr,w)=>{if(pr.goal==='maintain')return 0;const ww=w||pr.weight||latestW()||75;return pr.pct!=null?ww*pr.pct/100:(pr.rate||0)};
function migrateProfile(){const pr=S.profile;if(!pr||pr.goal==='maintain'||pr.pct!=null)return false;
  pr.pct=pr.goal==='cut'?0.75:0.25;
  if(pr.applied){const r=calcTargets(pr);if(r)Object.assign(S.settings,{kcal:r.kcal,protein:r.protein,carbs:r.carbs,fat:r.fat})}
  return true}
function calcTargets(pr){
  const w=pr.weight??latestW(),h=pr.height,a=pr.age;if(!w||!h||!a)return null;
  const bmr=Math.round(10*w+6.25*h-5*a+(pr.sex==='f'?-161:5));
  const tdee=Math.round(bmr*pr.act);
  const rk=rateKg(pr,w),adj=pr.goal==='cut'?-rk*7700/7:pr.goal==='bulk'?rk*7700/7:0;
  const floor=Math.max(bmr,pr.sex==='f'?1200:1500);
  let kcal=Math.round((tdee+adj)/10)*10;const clamped=kcal<floor;if(clamped)kcal=Math.round(floor/10)*10;
  const protein=Math.round(w*(pr.goal==='cut'?2.2:pr.goal==='bulk'?2.0:1.8));
  const fat=Math.round(Math.max(kcal*0.25/9,w*0.5));
  const carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));
  return{w,bmr,tdee,kcal,protein,fat,carbs,clamped};
}
function goalLabel(){const p=S.profile;if(!p.applied)return'';const k=fmt(Math.round(rateKg(p)*100)/100);

  const out={},core={kind:'core'};const skip=new Set([...LOGK,'suppLog','photos','health']);
  Object.keys(S).forEach(k=>{if(!skip.has(k))core[k]=S[k]});out.core=core;
  const mk=d=>String(d).slice(0,7),M=k=>out['m-'+k]=out['m-'+k]||{kind:'month',month:k,sessions:[],meals:[],drinks:[],body:[],suppLog:{},health:{}};
  S.sessions.forEach(x=>M(mk(x.date)).sessions.push(x));S.meals.forEach(x=>M(mk(x.date)).meals.push(x));
  S.drinks.forEach(x=>M(mk(x.date)).drinks.push(x));S.body.forEach(x=>M(mk(x.date)).body.push(x));
  Object.entries(S.suppLog).forEach(([d,v])=>{M(mk(d)).suppLog[d]=v});
  Object.entries(S.health||{}).forEach(([d,v])=>{M(mk(d)).health[d]=v});
  S.photos.forEach(p=>{if(p.img)out['p-'+p.id]={kind:'photo',...p}});
  return out;
}
function applyRemote(docs){
  const d0=defaults(),core=docs.core||{};const n={...d0};
  Object.keys(core).forEach(k=>{if(k!=='kind')n[k]=core[k]});
  LOGK.forEach(k=>n[k]=[]);n.suppLog={};n.photos=[];n.health={};
  Object.values(docs).forEach(x=>{if(x.kind==='month'){LOGK.forEach(k=>n[k].push(...(x[k]||[])));Object.assign(n.suppLog,x.suppLog||{});Object.assign(n.health,x.health||{})}
    else if(x.kind==='photo'){const{kind,...ph}=x;n.photos.push(ph)}});
  n.sessions.sort((a,b)=>a.date<b.date?-1:1);
  ['mealPlan','groc','customIng','myRecipes','profile','drinks','supps','suppLog','photos','reports','health','cardio','cycle','bio'].forEach(k=>{if(!n[k])n[k]=d0[k]});
  S=JSON.parse(JSON.stringify(n));
}
function schedulePush(){clearTimeout(CL.timer);CL.timer=setTimeout(pushAll,900)}
async function pushAll(force){
  if(!CL.db)return;if(CL.busy){CL.again=true;return}CL.busy=true;
  try{const docs=JSON.parse(JSON.stringify(splitState())),col=CL.db.collection(CL.base);
    for(const [id,body] of Object.entries(docs)){const str=JSON.stringify(body);if(!force&&CL.last[id]===str)continue;
      try{await col.doc(id).set(body);CL.last[id]=str}catch(e){
        if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,1500+Math.random()*1000));try{await col.doc(id).set(body);CL.last[id]=str}catch(e2){CL.status='offline'}}
        else if(e&&e.code==='quota_exceeded'){toast('⚠️ Bulut depolama dolu: eski fotoğrafları sil');}
        else if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){CL.status='local';CL.db=null;render(true);if(CL.base==='pulse')toast('Bulut kaydı kullanılamıyor; veriler bu cihazda tutuluyor');break}
        else{CL.status='offline'}}}
    if(CL.db)for(const id of Object.keys(CL.last)){if(!docs[id]){try{await col.doc(id).delete();delete CL.last[id]}catch(e){}}}
    if(CL.db&&CL.status==='offline')CL.status='synced';
    if(CL.db&&CL.status==='synced')CL.lastSync=Date.now();
  }finally{CL.busy=false;if(CL.again){CL.again=false;schedulePush()}}
}
async function initCloud(){
  const [db,user,sample]=await Promise.all([cuse('db'),cuse('user'),cuse('sample')]);
  CL.sample=sample||null;CL.user=user||null;CL.sdb=db||null;
  if(sample)render(true);
  if(!db||!user)return;
  let base=null;try{if(await user.isOwner())base='pulse';else{const id=await user.id();if(id)base='data/users/'+id}}catch(e){}
  if(!base)return;
  CL.db=db;CL.base=base;CL.status='loading';render(true);
  const t=setTimeout(()=>{if(CL.status==='loading'){CL.status='offline';render(true)}},10000);
  try{const snap=await db.collection(base).get();clearTimeout(t);
    const docs={};snap.docs.forEach(d=>{if(d.exists)docs[d.id]=JSON.parse(JSON.stringify(d.data()))}); // buluttan gelen veri kilitli (salt okunur) olabilir: değiştirilebilir kopya al
    if(!docs.core){CL.status='synced';await pushAll(true);if(!FRESH)toast('☁️ Verilerin buluta taşındı')}
    else{const remoteTs=docs.core._ts||0;
      Object.entries(docs).forEach(([id,b])=>CL.last[id]=JSON.stringify(b));
      if(!FRESH&&!window.__bootFresh&&(S._ts||0)>remoteTs){CL.status='synced';await pushAll()}
      else{applyRemote(docs);CL.status='synced';CL.lastSync=Date.now();if(migrateProfile())save();cacheLocal();if(!S.active&&ui.view==='workout')ui.view='home';render(true)}}
  }catch(e){clearTimeout(t);CL.db=null;CL.err=e&&e.code||'err';CL.status=(e&&(e.code==='unavailable'||e.code==='resource_exhausted'))?'offline':'local';render(true);setTimeout(()=>socLoad(true),500)}
}

function demoHR(r,g,today){const now=new Date(),lim=today?Math.floor((now.getHours()*60+now.getMinutes())/15):96,o=[],wo=68+Math.floor(r()*8);
  for(let t=0;t<96;t++){if(t>=lim){o.push(null);continue}const h=t/4;let v;
    if(h<7)v=56+g()*1.5+Math.sin(t)*1.5;else if(h<8)v=60+(h-7)*14+g()*3;else v=74+g()*7+Math.sin(t/3)*5;
    if(!today&&t>=wo&&t<wo+5)v=118+r()*28;if(h>=22.5)v=63+g()*2;o.push(Math.round(v))}return o}

  const hm=m=>{m=((Math.round(m)%1440)+1440)%1440;return z(Math.floor(m/60))+':'+z(m%60)},o={};
  for(let i=44;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const wk=d.getDay()===6||d.getDay()===0;
    const min=Math.round(445+g()*25+(wk?20:0)),awake=Math.round(28+r()*14),deep=Math.round(min*(0.17+r()*0.05)),rem=Math.round(min*(0.19+r()*0.05));
    const bed=23*60+45+g()*22+(wk?55:0);
    o[dkey(d)]={sleep:{min,deep,rem,light:min-deep-rem,awake,eff:Math.round(min/(min+awake)*100),bed:hm(bed),wake:hm(bed+min+awake)},
      hrv:Math.round(70+g()*5+(i===0?6:0)),rhr:Math.round(60+g()*1.5-(i===0?1:0)),spo2:Math.round(96+r()*2),resp:Math.round((14.8+g()*0.3)*10)/10,
      steps:Math.round(i===0?4200:6000+r()*5500),active:Math.round(i===0?12:18+r()*45),kcalOut:Math.round(2450+r()*450),hr15:demoHR(r,g,i===0)}}

const SDMIN={hrv:4,rhr:1.5,spo2:0.8,resp:0.4};
function baseline(key,d){const H=HD(),v=[];for(let i=1;i<=30;i++){const x=new Date(d+'T12:00');x.setDate(x.getDate()-i);const r=H[dkey(x)];if(r&&r[key]!=null)v.push(r[key])}

  const rec=(x.hrv!=null||x.rhr!=null)?clampS(62+13*zz('hrv')-9*zz('rhr')+(sl.min?(Math.min(1.1,sl.min/NEED)-0.9)*55:0)):null;
  const sleep=sl.min?clampS(Math.min(1,sl.min/NEED)*76+(sl.eff||88)*0.25):null;
  const d7=lastNDays(d,7),sets=d7.reduce((a,k)=>a+trainedOn(k).reduce((s2,ss)=>s2+ss.sets.length,0),0),act=d7.reduce((a,k)=>a+((H[k]||{}).active||0),0);

function normLines(arr){const db=ING(),out=[],bad=[];
  (arr||[]).forEach(x=>{const n=matchIng(x.name);if(!n){bad.push(x.name);return}const d=db[n];
    let u=x.unit;if(u!==d.u&&u!==d.pu)u=(d.pu&&/adet|dilim|ölçek|kaşık|yaprak|demet|kutu/.test(String(u)))?d.pu:d.u;

    let st=x.state;if(d.st){const f=d.st.find(s=>s.n.toLocaleLowerCase('tr-TR')===String(st||'').toLocaleLowerCase('tr-TR'));st=f?f.n:d.st[0].n}else st=undefined;

  return{lines:out,bad}}

function suggest(e){
  const lp=lastPerf(e.name);
  if(e.t){const k=num(e.fix)||0;
    if(!lp)return{kg:k,reps:e.repMin,why:`⏱ Süreli hareket: hedef <b>${e.repMin}–${e.repMax} sn</b>. Aşağıdaki butona bas, sayaç geri saysın; formun bozulursa Durdur'a bas.`};
    const minS=Math.min(...lp.sets.map(s=>s.reps));
    if(minS>=e.repMax)return{kg:k,reps:e.repMax,why:`Geçen sefer tüm setlerde <b>${e.repMax} sn</b> tuttun → zorlaştır: zor versiyona geç (↔ alternatif) ya da ağırlık ekle.`};

const mKey=n=>String(n||'').toLocaleLowerCase('tr-TR').replace(/\s+/g,' ').trim();
function freqMeals(n=8){const cut=Date.now()-90*864e5,g={};
  S.meals.forEach(m=>{const t=new Date(m.date+'T12:00').getTime();if(t<cut||!m.name||!(m.kcal>0))return;const k=mKey(m.name);const o=g[k]||(g[k]={c:0,last:m,t:0});o.c++;if(t>=o.t){o.t=t;o.last=m}});
  return Object.values(g).filter(o=>o.c>=2||(S.favMeals||[]).includes(mKey(o.last.name))).sort((a,b)=>b.c-a.c||b.t-a.t).slice(0,n).map(o=>({...o.last,cnt:o.c}))}
function freqRow(){const L=freqMeals();if(!L.length)return '';

function remDue(){const R=remCfg(),n=new Date(),now=n.getHours()*60+n.getMinutes(),d=dkey(),out=[];let fired={};try{fired=JSON.parse(localStorage.getItem('hm-rem')||'{}')}catch(e){}
  if(fired._d!==d)fired={_d:d};const due=(id,t,win=90)=>{if(fired[id])return false;return now>=t&&now-t<=win};
  if(R.water.on){const wg=waterGoal(d).goal,fl=fluid(d);for(let t=R.water.from*60;t<=R.water.to*60;t+=Math.max(1,R.water.every)*60){const exp=wg*Math.min(1,(t-R.water.from*60)/Math.max(60,(R.water.to-R.water.from)*60));
    if(due('w'+t,t,60)&&fl<exp-100)out.push({id:'w'+t,ic:'💧',t:'Su iç! 💧',m:`Bugün ${(fl/1000).toFixed(1).replace('.',',')} / ${(wg/1000).toFixed(1).replace('.',',')} L içtin.`,act:[['+250 ml',"A.drink('su',250)"]]});else if(due('w'+t,t,60))fired['w'+t]=1}}
  if(R.supp.on&&suppsFor(d).length&&due('s',hm(R.supp.time))){const L=S.suppLog[d]||{},left=suppsFor(d).filter(x=>!L[x.id]);if(left.length)out.push({id:'s',ic:'💊',t:'Takviye zamanı',m:left.map(x=>suppInfo(x).n).join(', '),act:[['Yemek sekmesi',"A.go('food')"]]});else fired.s=1}
  if(R.train.on&&R.train.days.includes(n.getDay())&&due('t',hm(R.train.time))){if(!trainedOn(d).length&&!S.active){const p=todaysPlan();out.push({id:'t',ic:'🏋️',t:'Antrenman vakti',m:p?`Sıradaki: ${p.name}`:'Bugün antrenman günün.',act:p?[['Başlat',`A.start('${p.id}')`]]:[['Antrenman',"A.go('programs')"]]})}else fired.t=1}
  if(R.meal.on)R.meal.times.forEach((tm,i)=>{if(due('m'+i,hm(tm))){const nm=R.meal.times.length===3?['Kahvaltı','Öğle yemeği','Akşam yemeği'][i]:'Yemek';const t=dayTotals(d);out.push({id:'m'+i,ic:'🍽️',t:`${nm} vakti, bir şeyler ye`,m:`Bugün ${Math.round(t.kcal)} / ${S.settings.kcal} kcal, protein ${Math.round(t.p)} g. Yediğini kaydetmeyi unutma.`,act:[['📸 Fotoğrafla ekle',"A.snap()"],['🧑‍🍳 Ne yesem?',"A.go('food');A.cook('ask')"]]})}});

  localStorage.setItem('hm-rem',JSON.stringify(fired));return out}

function sleepCoach(){const H=HD(),d=dkey(),sc=healthToday(),SC=S.sleepCoach||{};
  const wakes=lastNDays(d,7).map(k=>((H[k]||{}).sleep||{}).wake).filter(Boolean).map(hm);
  const wake=SC.wake?hm(SC.wake):wakes.length>=3?Math.round(wakes.reduce((a,b)=>a+b,0)/wakes.length/5)*5:450;
  let need=SC.need||480;const why=[];const debt=sleepDebt(d);
  if(debt>60){const add=Math.min(45,Math.round(debt/7/5)*5);if(add){need+=add;why.push(`7 günlük uyku borcun ${fmtMin(debt)} → +${add} dk`)}}
  const stn=strainOf(d);if(stn!=null&&stn>=14){need+=20;why.push(`Bugünkü yükün yüksek (${fmt(stn)}) → +20 dk`)}
  if(sc&&sc.rec!=null&&sc.rec<40){need+=20;why.push(`Toparlanman düşük (%${sc.rec}) → +20 dk`)}
  if(trainedOn(d).length&&!why.some(w=>w.includes('yük'))){need+=10;why.push('Bugün antrenman yaptın → +10 dk')}
  const lat=15,bed=((wake-need-lat)%1440+1440)%1440,f=m=>z(Math.floor(m/60)%24)+':'+z(m%60);
  return{bed:f(bed),wake:f(wake),need,why,lat,real:!!(sc&&!sc.demo),hasData:hasHealth()}}
function sleepCoachCard(){const c=sleepCoach();
  return `<div class="card slc" onclick="A.sleepCoachInfo()"><div class="row between"><b>🌙 Uyku koçu</b><span class="lbl">${c.real?'verine göre':'tahmini'} ›</span></div>
   <div class="slc-r"><div><small>Bu gece yat</small><b>${c.bed}</b></div><i>→</i><div><small>Kalk</small><b>${c.wake}</b></div><div><small>Uyku ihtiyacı</small><b>${fmtMin(c.need)}</b></div></div>
   ${c.why.length?`<div class="lbl" style="margin-top:6px">${c.why[0]}${c.why.length>1?' +'+(c.why.length-1):''}</div>`:''}${!c.real?'<div class="lbl" style="margin-top:4px;font-size:11.5px">Fitbit bağlanınca uyku borcun, HRV ve toparlanmana göre kişiselleşir.</div>':''}</div>`}

function weekInsights(){
  const past=lastNDays(dkey(),8).slice(1).reverse(),liked={},skipped={},notes=[];let planned=0,eaten=0;
  past.forEach(d=>Object.values(S.mealPlan[d]||{}).forEach(x=>{planned++;if(x.eaten){eaten++;liked[x.rid]=(liked[x.rid]||0)+1}else skipped[x.rid]=(skipped[x.rid]||0)+1}));

  const avgK=logged.length?Math.round(logged.reduce((a,d)=>a+dayTotals(d).kcal,0)/logged.length):null,avgP=logged.length?Math.round(logged.reduce((a,d)=>a+dayTotals(d).p,0)/logged.length):null;

  const w1=bw.filter(x=>age(x)<7),w0=bw.filter(x=>age(x)>=7&&age(x)<14),dW=w1.length&&w0.length?av(w1)-av(w0):null;

    else notes.push(`Kilo değişimin (${sg(dW)} kg/hafta) hedefinle uyumlu, kaloriyi aynı tuttum.`)}
  if(avgK!=null)notes.push(`Geçen hafta kayıtlı ${logged.length} günde ortalama <b>${avgK} kcal</b> ve <b>${avgP} g protein</b> aldın (hedef ${st.kcal} kcal, ${st.protein} g).`);
  if(avgP!=null&&avgP<st.protein*0.9){pw=1.3;notes.push('Protein hedefin altında kaldı: bu hafta protein oranı yüksek tarifleri öne aldım.')}

  if(lk.length)notes.push(`Yediğin tarifleri tekrar ekledim: ${lk.map(r=>esc(r.n)).join(', ')}.`);
  const sk=Object.keys(skipped).filter(id=>!liked[id]);if(sk.length)notes.push(`Planlanıp yenmeyen ${sk.length} tarifin önceliğini düşürdüm.`);

  return{adj,pw,liked,skipped,notes}}
function pickRecipe(slot,share,used,avoid,ctx){ctx=ctx||{adj:0,pw:0.6,liked:{},skipped:{}};
  const tgt=(S.settings.kcal+ctx.adj)*share;let best=null;
  const g=S.profile.applied?S.profile.goal:'maintain';
  ALL().filter(r=>r.slot===slot&&phaseOk(r)).forEach(r=>[0.75,1,1.25,1.5].forEach(sv=>{
    if(slot==='s'&&sv<1)return;if(r.phase&&sv!==1&&sv!==1.25)return;
    let sc=Math.abs(r.kcal*sv-tgt)/tgt-(r.p*4/r.kcal)*ctx.pw+(used[r.id]||0)*0.35+(avoid.includes(r.id)?0.8:0)+Math.random()*0.3-(r.phase&&r.phase===g?0.25:0)

}
function runPlanner(mode){

  let prev=[];
  days.forEach(d=>{const cur=mode==='all'?{}:{...(S.mealPlan[d]||{})},today=[];
    SLOTS.forEach(([k,,sh])=>{if(cur[k]&&!cur[k].eaten){today.push(cur[k].rid);return}if(cur[k])return;

    if(mode==='all')S.mealPlan[d]=Object.fromEntries(Object.entries(S.mealPlan[d]||{}).filter(([,x])=>x.eaten));
    prev=today});

  ui.mpBusy=true;ui.mpClosed={};render(true);

    (S.mealPlan[d]=S.mealPlan[d]||{})[k]=a;

      sheet(`<h3>✨ Haftan planlandı</h3><div class="sugg" style="margin:0 0 12px">${days.length} gün · günlük ortalama <b>${avg} kcal</b> (hedef ${S.settings.kcal}${ctx.adj?`, bu hafta ${ctx.adj>0?'+':''}${ctx.adj}`:''})</div>

  S.sessions.forEach(s=>{if(new Date(s.date).getTime()>=lim)return;s.sets.forEach(x=>{if(x.ex===name&&!x.t&&x.kg>0)b=Math.max(b,e1rm(x.kg,x.reps))})});return b}

function loadOf(sets,date){let L=0;const c={};
  sets.forEach(x=>{let I=.7;if(!x.t&&x.kg>0){const b=c[x.ex]??(c[x.ex]=bestE1(x.ex,date)||e1rm(x.kg,x.reps));I=Math.min(1.1,e1rm(x.kg,x.reps)/b)}
    if(x.rpe)I*=.7+.03*Math.min(10,x.rpe);L+=.5+.5*I});

const loadLbl=v=>v<35?['Hafif','#3fd0ff']:v<60?['Orta','#3ee6a0']:v<80?['Yüksek','#ffb547']:['Çok yüksek','#ff5a3c'];

(()=>{const tag={w:'f',wb:'f',m:'m'};const C=/press|push|row|pull|squat|lunge|dead|thrust|bridge|dip|step|burpee|walk/i;
  const eqOf=n=>/band/i.test(n)?'band':/dumbbell/i.test(n)?'dumbbell':'bodyweight';
  const add=(en,tr,m,t,note,tg,lv)=>{if(!en||XDB.some(x=>x[0]===en)||!GMUS.some(g=>g[0]===m))return;XDB.push([en,tr||en,m,eqOf(en),lv,t?'t':C.test(en)?'c':'i',note||'',tg])};
  Object.entries(HOME_PROGRAMS).forEach(([k,g])=>g.plans.forEach(p=>p.exercises.forEach(e=>{const lv=/HIIT/.test(p.name)?2:1;
    add(e.name,e.tr,e.muscle,e.t,e.note,tag[k],lv);if(e.alt){const a=altP(e.alt);add(a.en,a.tr,e.muscle,a.t,'',tag[k],lv)}})))})();

function exMus(name,m){const x=XBY[name],c=x?x[5]==='c':/press|push|row|pull|squat|lunge|dead|thrust|bridge|dip|step/i.test(name);let s=[];
  if(/burpee|mountain|plank jack|climber|bear crawl/i.test(name))s=['quads','shoulders','chest','core'];
  else if(m==='chest')s=c?['triceps','shoulders']:['shoulders'];
  else if(m==='back')s=/dead|good morning|rack pull|extension/i.test(name)?['lowback','hamstrings','glutes']:/shrug/i.test(name)?['forearms']:/pullover|straight arm/i.test(name)?['triceps','core']:c?['biceps','shoulders','forearms']:['shoulders'];
  else if(m==='shoulders')s=c?['triceps','back']:/rear|face pull|pull-apart|reverse/i.test(name)?['back']:[];
  else if(m==='biceps')s=['forearms'];
  else if(m==='triceps')s=c?['chest','shoulders']:[];
  else if(m==='quads')s=c?['glutes','hamstrings','core']:[];
  else if(m==='hamstrings')s=c?['glutes','lowback','forearms']:['calves'];
  else if(m==='glutes')s=c?['hamstrings','quads']:[];
  else if(m==='core')s=/carry/i.test(name)?['forearms','back']:/russian|twist|woodchop|side|windmill|pallof/i.test(name)?[]:[];
  const lv={};s.forEach(k=>lv[k]=.45);lv[m]=1;if(m==='back'&&/dead|rack pull|extension|superman/i.test(name))lv.lowback=1;return lv}
const backView=m=>['back','triceps','hamstrings','glutes','calves','lowback'].includes(m);
function bodyMini(name,m,w=34){return bodySvg(exMus(name,m),{view:backView(m)?'back':'front',w,cls:'mini',labels:false})}

/* ---------- sheets / toast ---------- */
let _sb=false,_sp=null;
function sheet(html,keep){if(_sb){_sp=[html,keep];return}_sb=true;
  try{_sheet(html,keep)}finally{_sb=false}
  if(_sp){const q=_sp;_sp=null;sheet(q[0],true)}}
function _sheet(html,keep){const old=document.querySelector('#scrim .sheet'),st=keep&&old?old.scrollTop:0;
  closeSheet();const d=document.createElement('div');d.className='scrim';d.id='scrim';d.innerHTML=`<div class="sheet" ${keep?'style="animation:none"':''}>${html}</div>`;
  d.addEventListener('click',e=>{if(e.target===d)closeSheet()});document.body.appendChild(d);if(st)d.firstChild.scrollTop=st}
function closeSheet(){const s=document.getElementById('scrim');if(s){s.id='';try{s.remove()}catch(e){}}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function ask(q,yes,label='Evet'){sheet(`<h3>${q}</h3><div class="grid2"><button class="btn ghost" onclick="A.close()">Vazgeç</button><button class="btn" id="yes">${label}</button></div>`);
  document.getElementById('yes').onclick=()=>{closeSheet();yes()}}

/* ---------- rest timer ---------- */
let restEnd=0,restT=null;
function startRest(sec){restEnd=Date.now()+(sec||S.settings.rest)*1000;restBar();clearInterval(restT);restT=setInterval(restBar,250)}
function restBar(){
  let el=document.getElementById('rest');const left=Math.ceil((restEnd-Date.now())/1000);
  if(left<=0||ui.view!=='workout'){if(el)el.remove();if(left<=0)clearInterval(restT);return}
  if(!el){el=document.createElement('div');el.className='rest';el.id='rest';
    el.innerHTML='<span>⏱ Dinlenme <span id="rt"></span></span><button onclick="A.restAdd(30)">+30</button><button onclick="A.restAdd(-999)">Atla</button>';document.body.appendChild(el)}
  document.getElementById('rt').textContent=Math.floor(left/60)+':'+z(left%60);
}

let hold=null,_ac=null,_errT=0;
addEventListener('error',ev=>{if(Date.now()-_errT<4000)return;_errT=Date.now();try{toast('⚠️ Hata: '+String(ev.message||'').slice(0,80))}catch(_){}});
function beep(f=880,d=.12){try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const o=_ac.createOscillator(),g=_ac.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(_ac.destination);o.start();o.stop(_ac.currentTime+d)}catch(_){}}
setInterval(()=>{if(!S.active||ui.view!=='workout')return;
  const w=document.getElementById('wkt');if(w)w.textContent='⏱ '+mmss(Date.now()-S.active.startedAt);
  if(hold&&hold.inf){const n=document.getElementById('holdt');if(n)n.textContent=tFmt((Date.now()-hold.start)/1000);}
  else if(hold){const left=hold.target-(Date.now()-hold.start)/1000,sec=Math.ceil(left);
    const n=document.getElementById('holdt'),b=document.getElementById('holdb');if(n)n.textContent=tFmt(sec);if(b)b.style.width=Math.min(100,(Date.now()-hold.start)/10/hold.target)+'%';
    if(sec<=3&&sec>0&&hold.bp!==sec){hold.bp=sec;beep(660,.08)}
    if(left<=0)A.holdStop(true)}},200);
/* ---------- actions ---------- */
const A=window.A={
  close:closeSheet,

  openPlan(id,back){ui.planId=id;ui.planBack=back||'programs';ui.view='plan';render()},
  pickPlan(){sheet(`<h3>Antrenman seç</h3>${S.plans.map(p=>`<button class="btn ghost" style="margin-bottom:10px;text-align:left" onclick="A.close();A.openPlan('${p.id}')">${esc(p.name)} <span class="muted" style="font-size:13px">· ${p.exercises.length} egzersiz</span></button>`).join('')}`)},
  start(id){
    const p=plan(id);
    S.active={planId:p.id,planName:p.name,startedAt:Date.now(),idx:0,ex:p.exercises.map(e=>{const sg=suggest(e);
      const st=Array.from({length:e.sets},()=>({kg:sg.kg??'',reps:sg.reps??'',rpe:'',done:false}));
      if(e.last&&e.last!=='n'&&!e.t&&st.length){const l=st[st.length-1];l.ty=e.last;if(e.last==='d'&&num(sg.kg)>0)l.kg=kgRound(num(sg.kg)*.75,e.inc)}
      const wu=Array.from({length:e.t?0:Math.min(3,e.wu||0)},(_,k)=>({kg:num(sg.kg)>0?kgRound(num(sg.kg)*(k?.7:.5),e.inc):'',reps:k?5:8,rpe:'',done:false,ty:'w'}));
      return{...e,o:e.name,sugg:sg,sets:[...wu,...st]}})};
    save();countdown(p);
  },
  setVal(i,k,v){const s=S.active.ex[S.active.idx].sets[i];s[k]=v;save();
    const btn=document.querySelector('.bottom-cta .btn');const e=S.active.ex[S.active.idx];const ni=e.sets.findIndex(x=>!x.done);
    if(btn&&ni===i&&!e.t){const ns=e.sets[i];btn.textContent=`Set ${i+1} kaydet · ${ns.kg!==''?ns.kg+' kg':'? kg'} × ${ns.reps||'?'}`}},
  toggleSet(i){const s=S.active.ex[S.active.idx].sets[i];
    if(!s.done){if(num(s.kg)==null||!num(s.reps)){toast('Önce kg ve tekrar gir');return}s.done=true;const e=S.active.ex[S.active.idx];
      if(tyOf(s)!=='w')e.sets.forEach((o,j)=>{if(j>i&&!o.done&&(o.kg===''||o.kg==null)&&tyOf(o)!=='w')o.kg=s.kg});
      const nx=e.sets[i+1];
      if(tyOf(s)==='w')startRest(45);
      else if(nx&&!nx.done&&tyOf(nx)==='d'){if(num(s.kg)>0&&(nx.kg===''||num(nx.kg)>=num(s.kg)))nx.kg=kgRound(num(s.kg)*.75,e.inc);restEnd=0;toast('⬇ Drop set: kiloyu düşür, dinlenmeden devam et')}
      else if(!A._ssAdv())startRest()}else s.done=false;
    save();render()},
  addSet(){const e=S.active.ex[S.active.idx];const l=e.sets.filter(x=>tyOf(x)!=='w').pop()||e.sets[e.sets.length-1]||{};e.sets.push({kg:l.kg??'',reps:l.reps??'',rpe:'',done:false});save();render()},
  cta(){const a=S.active,e=a.ex[a.idx],i=e.sets.findIndex(s=>!s.done);
    if(i>=0&&e.t)return hold&&hold.ai===a.idx&&hold.i!=null?A.holdStop(false):A.holdStart();
    if(i>=0)return A.toggleSet(i);

    A._swapApply=apply;document.querySelectorAll('#scrim [data-k]').forEach(b=>b.onclick=()=>apply(all[+b.dataset.k].name));

  finishAsk(){const n=S.active.ex.flatMap(e=>e.sets).filter(s=>s.done).length;
    ask(n?`Antrenmanı bitir? (${n} set kaydedildi)`:'Hiç set kaydetmedin. Antrenmanı iptal et?',()=>n?A.finish():(S.active=null,save(),A.go('home')),n?'Bitir':'İptal et')},
  finish(){hold=null;
    const a=S.active;const sets=[];
    const wu=[];a.ex.forEach(e=>e.sets.forEach(s=>{if(!s.done)return;const o={ex:e.name,muscle:e.muscle,kg:num(s.kg)??0,reps:num(s.reps),rpe:num(s.rpe),...(e.t?{t:1}:{})};const ty=tyOf(s);if(ty==='w')wu.push(o);else{if(ty!=='n')o.ty=ty;sets.push(o)}}));
    if(!sets.length){S.active=null;save();return A.go('home')}
    const prs=[];[...new Set(sets.map(s=>s.ex))].forEach(n=>{
      const prev=S.sessions.flatMap(s=>s.sets).filter(x=>x.ex===n);if(!prev.length)return;
      if(prev.some(x=>x.t))return;const pb=Math.max(...prev.map(x=>e1rm(x.kg,x.reps))),nb=Math.max(...sets.filter(x=>x.ex===n).map(x=>e1rm(x.kg,x.reps)));
      if(nb>pb)prs.push(`${n}: tahmini 1RM ${fmt(Math.round(pb*10)/10)} → ${fmt(Math.round(nb*10)/10)} kg`)});
    const sess={id:uid(),planId:a.planId,planName:a.planName,date:new Date().toISOString(),dur:Math.round((Date.now()-a.startedAt)/1000),sets,prs};if(wu.length)sess.wu=wu;
    const tp=plan(a.planId);if(tp&&tp.tmpl!=='gen-last'&&tp.tmpl!=='quick-last'){try{const df=tplDiff(tp,a);if(df.chg.length){sess.tpl={pid:tp.id,chg:df.chg,out:df.out,prev:df.prev,applied:false};if(S.settings.autoTpl!==false){tp.exercises=JSON.parse(JSON.stringify(df.out));sess.tpl.applied=true}}}catch(err){}}
    S.sessions.push(sess);
    const tdp=todaysPlan();if(tdp&&tdp.id===a.planId)S.next=(S.next+1)%activePlans().length;
    S.active=null;restEnd=0;save();ui.view='summary';render();
  },

  ssPair(j){const a=S.active,cur=a.ex[a.idx],o=a.ex[j];if(!o)return;const used=new Set(a.ex.map(x=>x.ss).filter(Boolean));

    e.fix=cur.altFix!==undefined?cur.altFix:/dumbbell/i.test(x.en)?undefined:0;if(e.fix===undefined)delete e.fix;if(e.altFix===undefined)delete e.altFix;

    delete e.kgs;delete e.startKg;{const gx=XBY[x.en];if(gx&&!e.t){const g=genEx(gx,gp().lvl,[]);if(g.kgs){e.kgs=g.kgs;e.startKg=g.startKg;delete e.fix}else if(g.fix){e.fix=g.fix}}}
    if(hold&&hold.ai===a.idx)hold=null;
    e.sugg=suggest(e);e.sets=cur.sets.map(s=>s.done?s:{kg:e.sugg.kg??'',reps:e.sugg.reps??'',rpe:'',done:false});
    a.ex[a.idx]=e;save();render();toast('↔ '+(x.tr||x.en))},
  healthDemo(v){S.healthDemo=!!v;_demo=null;save();render(true)},

/* ---------- countdown ---------- */
function countdown(p){
  const d=document.createElement('div');d.className='cd';const C=2*Math.PI*98;
  const first=S.active.ex[0];
  d.innerHTML=`<div class="k">${esc(p.name)} · ${p.exercises.length} egzersiz</div><div class="t">Antrenman başlıyor</div>
   <div class="ring"><svg width="210" height="210"><circle cx="105" cy="105" r="98" stroke="rgba(255,255,255,.15)" stroke-width="4" fill="none" stroke-dasharray="2 8"/>
   <circle id="cdr" cx="105" cy="105" r="98" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1s linear"/></svg><div class="n" id="cdn">3</div></div>
   <div style="opacity:.8;font-size:14px">İlk egzersiz · ${esc(first.name)}, ${first.sets.length} set</div><div style="opacity:.5;font-size:12px;margin-top:40px">Atlamak için dokun</div>`;
  document.body.appendChild(d);
  let n=3;const done=()=>{clearInterval(t);d.remove();if(S.active){S.active.startedAt=Date.now();save()}ui.view='workout';render()};
  d.onclick=done;
  requestAnimationFrame(()=>{document.getElementById('cdr').style.strokeDashoffset=C*(2/3)});
  const t=setInterval(()=>{n--;if(n<=0)return done();const el=document.getElementById('cdn');el.textContent=n;el.style.animation='none';void el.offsetWidth;el.style.animation='';
    document.getElementById('cdr').style.strokeDashoffset=C*((n-1)/3)},1000);
}

function splash(){if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const d=document.createElement('div');d.className='splash';d.innerHTML=`<div class="sp-word">${'HYPEMODE'.split('').map((c,i)=>`<span style="animation-delay:${0.25+i*0.09}s">${c}</span>`).join('')}</div><div class="sp-line"></div>`;
  document.body.appendChild(d);let done=false;const end=()=>{if(done)return;done=true;d.classList.add('out');$app.classList.add('boot');setTimeout(()=>{d.remove()},650);setTimeout(()=>$app.classList.remove('boot'),1400)};
  d.onclick=end;setTimeout(end,1650)}


if(migrateProfile())save();
splash();
render();
window.render=render;window.__hm={S:()=>S,CL,ui:()=>ui};

})();
